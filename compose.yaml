services:
  postgres:
    image: postgres:16
    container_name: banking-api-postgres
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d banking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
